# usage-board — app-only deployment (behind YOUR OWN reverse proxy).
# Single-file compose: the app published on 127.0.0.1:APP_PORT (default 8080),
# loopback only, no Caddy/TLS. The port is NOT reachable from other hosts; the
# local reverse proxy (nginx/Caddy/Traefik) is the only way in.
#
# Env delivery: variables come from the runner environment (a Dockhand/hawser
# agent passes its stack env via --env-file; locally `export` them or keep a
# .env next to this file — compose reads it for interpolation automatically).
# Secrets are NEVER committed to the repo.
services:
  app:
    image: ghcr.io/rast53/usage-board:latest
    # Always repull on `up`: a plain `docker compose up -d` is then enough to
    # move a host (fornex-usa) to the image of the newest main merge.
    pull_policy: always
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      CURSOR_SESSION_TOKEN: ${CURSOR_SESSION_TOKEN:-}
      USAGE_POLL_SECONDS: ${USAGE_POLL_SECONDS:-900}
      SITE_TITLE: ${SITE_TITLE:-}
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Moscow}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MANAGEMENT_KEY: ${OPENROUTER_MANAGEMENT_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      USAGE_PORT: "3210"
      USAGE_DATA_DIR: /app/data
      USAGE_STATIC_DIR: /app/static
    volumes:
      - app-data:/app/data
    ports:
      # Loopback only: never publish the bare app port on 0.0.0.0. TLS/auth is
      # terminated by the host reverse proxy in front of 127.0.0.1:APP_PORT.
      - "127.0.0.1:${APP_PORT:-8080}:3210"
    healthcheck:
      # 401 is fine: basic auth may be enabled. Anything else = unhealthy.
      test: ["CMD", "python3", "-c", "import urllib.request,urllib.error,sys;\ntry: urllib.request.urlopen('http://127.0.0.1:3210/api/health', timeout=5)\nexcept urllib.error.HTTPError as e: sys.exit(0 if e.code==401 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app-data:
