# usage-board — app-only deployment (behind YOUR OWN reverse proxy).
# Single-file compose: the app published on APP_PORT (default 8080),
# no Caddy, no TLS — terminate it (and basic auth if you like) at your proxy.
#
#   1) cp .env.example .env    2) set provider keys (+ BASIC_AUTH_* if the proxy won't do auth)
#   3) docker compose -f compose.app-only.yml up -d
#
# Merged equivalent of: docker-compose.yml + docker-compose.app-only.yml
services:
  app:
    image: ghcr.io/rast53/usage-board:latest
    restart: unless-stopped
    env_file: .env
    environment:
      USAGE_PORT: "3210"
      USAGE_DATA_DIR: /app/data
      USAGE_STATIC_DIR: /app/static
    volumes:
      - app-data:/app/data
    ports:
      - "${APP_PORT:-8080}:3210"
    healthcheck:
      # 401 is fine: basic auth may be enabled. Anything else = unhealthy.
      test: ["CMD", "python3", "-c", "import urllib.request,urllib.error,sys;\ntry: urllib.request.urlopen('http://127.0.0.1:3210/api/health', timeout=5)\nexcept urllib.error.HTTPError as e: sys.exit(0 if e.code==401 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app-data:
